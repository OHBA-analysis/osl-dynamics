# Configuration file for packaging
# See https://packaging.python.org/en/latest/guides/writing-pyproject-toml for details

[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osl-dynamics"
dynamic = ["version"]
description = "Toolbox for studying dynamic functional brain networks in MEG, EEG and fMRI data"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "neuroimaging",
    "neuroscience",
    "MEG",
    "EEG",
    "fMRI",
    "electrophysiology",
    "brain dynamics",
    "brain networks",
    "dynamic functional connectivity",
    "hidden markov model",
    "resting state",
    "burst detection",
    "spectral analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Note: TensorFlow is deliberately not a required dependency
dependencies = [
    "fslpy",
    "h5py",
    "mat73",
    "matplotlib",
    "mne",
    "mne-icalabel[onnx]",
    "nibabel",
    "nilearn",
    "numba",
    "numpy",
    "packaging",
    "pandas",
    "pqdm",
    "pyvista",
    "pyyaml",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "threadpoolctl",
    "tqdm",
]

[project.optional-dependencies]
tf = [
    "tensorflow==2.16.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tensorflow-probability==0.24.*; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tf-keras==2.16.*; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tensorflow==2.19.*; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tensorflow-probability[tf]==0.25.*; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# As above, but with the NVIDIA CUDA libraries needed to train models on a GPU
tf-cuda = [
    "tensorflow[and-cuda]==2.19.*; sys_platform == 'linux'",
    "tensorflow-probability[tf]==0.25.*; sys_platform == 'linux'",
    # CUDA is only available on Linux, so fall back to the CPU packages
    "osl-dynamics[tf]; sys_platform != 'linux'",
]

[project.urls]
"Homepage" = "https://github.com/OHBA-analysis/osl-dynamics"
"Documentation" = "https://osl-dynamics.readthedocs.io/en/latest/"

[project.scripts]
osl-dynamics = "osl_dynamics.config_api.pipeline:osl_dynamics_cli"

# The version number is derived automatically from git tags
[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.pdf,*.gii,*.scene'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'fo,fro,commun'
